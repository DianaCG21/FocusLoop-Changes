{% extends "base.html" %}
{% block content %}

<style>
  .btn-pink {
    background-color: #FF8FB1;
    color: white;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 50px;
    border: none;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255, 143, 177, 0.4);
    margin: 10px 0;
    width: 20%;
  }

  .btn-pink:hover {
        background-color: #FF4C82;
        color: #FFFFFF;
        box-shadow: 0 0 25px #FF4C82, 0 0 50px #c978ff;
        transform: translateY(-3px) scale(1.05);
    }
</style>

<div class="shadow-wrap">
  <div class="form-wrap">
    <h3>Sign up</h3>
    <form action="{% url 'base:student_signup' %}" method="POST">
      {% csrf_token %}
      {{ form.as_p }}

      {% if form.errors %}
      <div style="color:red; margin:10px 0;"> {{ form.errors }} </div>
      {% endif %}

      <button type="submit" class="btn btn-pink">Sign Up</button>
    </form>
    <center>
      <p style="margin: 20px;">Already have an account?</p>
    </center>
    <a class="signup-link" href="{% url 'base:login' %}">Login</a>
  </div>
</div>

{% endblock content %}
